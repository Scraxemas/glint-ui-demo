function watch(){let types=['All','Movie','Series','Sci-Fi','Fantasy','Comedy','Drama','Horror','Anime','Action'];let matches=D.movies.filter(x=>state.filter==='All'||x.type===state.filter||x.genre===state.filter);return `${pageHeader('Watch','An on-demand universe of movies, television, and anime. Designed for a Plex-powered library.',`<button class="btn outline" data-action="plexInfo">${icon('external')} Plex connection</button>`)}<div class="spotlight"><div class="spotlight-copy"><div class="overline">FEATURED TONIGHT · DEMO CATALOG</div><h1>Interstellar</h1><p>A cinematic voyage beyond the familiar. Discover the stories and worlds waiting in your library.</p><div class="kpi-mini"><span>2014</span><span>Sci-Fi</span><span>PG-13</span><span>2h 49m</span></div><div class="hero-actions"><button class="btn primary" data-action="details" data-id="interstellar">${icon('play')} Explore title</button><button class="btn outline" data-action="watchlist" data-id="interstellar">${icon(state.watchlist.includes('interstellar')?'check':'plus')} My List</button></div></div><div class="spotlight-art"></div></div>${section('Continue watching','Demo progress across your media.',movieRow(['the-last-of-us','interstellar','the-office','star-trek','breaking-bad']))}<section class="section"><div class="section-heading"><div><h2>Explore the library</h2><p class="section-sub">Filter across the sample catalog. Real Plex inventory comes later.</p></div><button class="section-link" data-action="myList">${icon('heart')} My List (${state.watchlist.length})</button></div><div class="filter-row">${types.map(x=>`<button class="filter-chip ${state.filter===x?'active':''}" data-action="watchFilter" data-id="${x}">${x}</button>`).join('')}</div><div class="media-grid">${matches.map(x=>posterCard(x)).join('')}</div></section>${demo('Plex is not connected. Posters are original abstract UI art; sample title names do not indicate media is present or licensed for streaming.')}`}
function currentProgram(c){const minutes=new Date().getHours()*60+new Date().getMinutes();const slot=Math.floor(minutes/30);return {title:c.shows[slot%c.shows.length],next:c.shows[(slot+1)%c.shows.length],percent:((minutes%30)*60+new Date().getSeconds())/18,slot}}
function live(){let c=D.channels.find(x=>x.num===state.channel)||D.channels[0];let p=currentProgram(c);const position=state.offset>0?Math.max(0,p.percent-state.offset/18):p.percent;const currentTime=new Date();const tm=(delta)=>{let d=new Date(currentTime.getTime()+delta*30*60000);return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})};return `${pageHeader('Live television','Six synchronized sample channels, an interactive guide, and a concept TiVo-style player.',`<span class="pill red">${icon('radio')} LIVE DEMO</span>`)}<div class="live-layout"><div class="live-stage"><div class="fake-video" ${artStyle(c.theme)}><div class="stage-top"><span class="pill red">● LIVE ${esc(c.num)}</span><span class="pill neutral">${state.paused?'PAUSED':'STREAM SIMULATOR'}</span></div><div class="tv-wordmark"><strong>${esc(p.title)}</strong><span>${esc(c.name)} · Channel ${c.num}</span></div><div class="stage-bottom"><span class="stage-subtitle">${state.offset?`Behind live by ~${Math.round(state.offset/60)}m`:state.paused?'Playback paused (UI only)':'Join the scheduled program in progress'}</span><span class="pill">${icon('volume')} HD</span></div></div><div class="live-controls"><div class="scrub-top"><span>${tm(0)}</span><span>${Math.round(position)}% · ${state.offset>0?'TIMESHIFT':'LIVE EDGE'}</span><span>Next: ${tm(1)}</span></div><div class="timeline"><span style="width:${position}%"></span></div><div class="controls"><button class="round-icon" title="Previous channel" data-action="channelStep" data-id="-1">${icon('back')}</button><button class="round-icon" title="Rewind 15s (mock)" data-action="liveRewind">${icon('rewind')}</button><button class="round-icon main" title="Pause / resume (mock)" data-action="pause">${icon(state.paused?'play':'pause')}</button><button class="round-icon" title="Catch up 15s (mock)" data-action="liveForward">${icon('forward')}</button><button class="round-icon" title="Go live" data-action="goLive">${icon('radio')}</button><button class="round-icon" title="Restart program (mock)" data-action="restart">${icon('restart')}</button><button class="round-icon" title="Record program (mock)" data-action="record">${icon('record')}</button><button class="round-icon" title="Next channel" data-action="channelStep" data-id="1">${icon('chev')}</button></div><div class="statline"><span>Up next on ${esc(c.name)}</span><strong>${esc(p.next)}</strong></div></div></div><div class="panel"><div class="section-heading"><div><h2>Channel lineup</h2><p class="section-sub">Click a channel to tune in.</p></div><span class="pill neutral">6 CHANNELS</span></div><div class="channel-list">${D.channels.map(ch=>{const pr=currentProgram(ch);return `<button class="channel-item ${state.channel===ch.num?'active':''}" data-action="tune" data-id="${ch.num}"><span class="channel-number">${ch.num}</span><span><strong>${esc(ch.name)}</strong><small>${esc(pr.title)}</small></span>${state.channel===ch.num?icon('radio'):icon('chev')}</button>`}).join('')}</div></div></div><section class="section"><div class="section-heading"><div><h2>Tonight's guide</h2><p class="section-sub">A time-based sample EPG. No real channel playout is active.</p></div><button class="section-link" data-action="recordings">${icon('record')} My Recordings (${state.recordings.length})</button></div><div class="epg"><div class="epg-row epg-head"><div>CHANNEL</div>${[0,1,2,3].map(n=>`<div>${tm(n)}</div>`).join('')}</div>${D.channels.map(ch=>{let pr=currentProgram(ch);return `<div class="epg-row"><div class="epg-channel">${ch.num}<small>${esc(ch.name)}</small></div>${[0,1,2,3].map(n=>`<button class="epg-program ${n===0?'now':''}" data-action="tune" data-id="${ch.num}"><strong>${esc(ch.shows[(pr.slot+n)%ch.shows.length])}</strong><small>${n===0?'Now playing':'Scheduled · Demo'}</small></button>`).join('')}</div>`}).join('')}</div></section><section class="section two-column"><div class="panel"><h3>How Glint Live will actually work</h3><p class="muted" style="line-height:1.8;margin-top:11px">The real build will keep schedules advancing by wall-clock time, even with zero viewers. Streaming and transcoding will start only when someone tunes in; rewinding, restarting and recording are separate Glint features to develop.</p></div><div class="panel"><h3>Broadcast controls</h3><div class="statline"><span>Playout</span><strong>Continuous / wall clock</strong></div><div class="statline"><span>Transcoding</span><strong>On-demand target</strong></div><div class="statline"><span>DVR</span><strong>Planned virtual recordings</strong></div></div></section>${demo('Player controls simulate interface state only. There is no real video, transcoding, EPG feed, or DVR recording in this prototype.')}`}
function comics(){let filters=['All','Manga','Comics'];let matches=D.comics.filter(x=>state.comicFilter==='All'||x.kind===state.comicFilter);return `${pageHeader('Comics','A quiet space for your favorite series, issues, graphic novels, and manga.',`<button class="btn outline" data-action="komgaInfo">${icon('external')} Komga connection</button>`)}<div class="spotlight"><div class="spotlight-copy"><div class="overline">THE READING ROOM</div><h1>One more chapter.</h1><p>Follow your favorite stories at your own pace. From classic comics to sprawling manga adventures.</p><div class="hero-actions"><button class="btn primary" data-action="comicDetails" data-id="one-piece">${icon('book')} Keep Reading</button><button class="btn outline" data-action="comicFilter" data-id="Manga">Browse manga</button></div></div><div class="spotlight-art" style="background:radial-gradient(ellipse at 50% 40%,#8a649e,#3b2f55 47%,#151827 90%)"></div></div>${section('Continue reading','Pick up a chapter or series.',`<div class="row-scroll media-row">${D.comics.filter(x=>x.read).map(x=>posterCard(x,'comic')).join('')}</div>`)}<section class="section"><div class="section-heading"><h2>Your digital shelves</h2><span class="pill neutral">DEMO COLLECTION</span></div><div class="filter-row">${filters.map(x=>`<button class="filter-chip ${state.comicFilter===x?'active':''}" data-action="comicFilter" data-id="${x}">${x}</button>`).join('')}</div><div class="media-grid">${matches.map(x=>posterCard(x,'comic')).join('')}</div></section>${demo('No comic files are shipped with this prototype. The reader shows placeholder illustrated pages and saves a local demo page number.')}`}
function gameCard(x){return `<div class="game-card"><div class="game-banner" ${artStyle(x.art)}><strong>${esc(x.name)}</strong></div><div class="game-card-copy"><div class="overline">${esc(x.tag)}</div><h3>${esc(x.name)}</h3><p>${esc(x.subtitle)}</p><div class="kpi-mini"><span>${esc(x.category)}</span><span>${esc(x.status)}</span></div><button class="btn slim ${x.id==='glint-snake'?'primary':'outline'}" data-action="gameDetails" data-id="${x.id}">${icon(x.id==='glint-snake'?'play':'info')} ${x.id==='glint-snake'?'Play demo':'View details'}</button></div></div>`}
function arcade(){let filters=['All','Original','Playable Demo','Retro','Concept'];let matches=D.games.filter(x=>state.arcadeFilter==='All'||x.category===state.arcadeFilter);return `${pageHeader('Arcade','Original games, experimental worlds, and a future home for legally usable retro classics.',`<span class="pill green">${icon('game')} ONE PLAYABLE MINI-GAME</span>`)}<div class="spotlight"><div class="spotlight-copy"><div class="overline">FEATURED ORIGINAL PROJECT</div><h1>Project Pancake</h1><p>A handcrafted birthday adventure filled with quests, companions, hidden surprises, and cooperative fun.</p><div class="hero-actions"><button class="btn primary" data-action="gameDetails" data-id="pancake">${icon('game')} Discover the game</button><button class="btn outline" data-route="projects">${icon('code')} Development notes</button></div></div><div class="spotlight-art" style="background:radial-gradient(ellipse at 52% 40%,#dfa66c,#5d4b8a 45%,#21233b 90%)"></div></div><section class="section"><div class="section-heading"><div><h2>Choose your next adventure</h2><p class="section-sub">Games and concepts in a unified launcher.</p></div></div><div class="filter-row">${filters.map(x=>`<button class="filter-chip ${state.arcadeFilter===x?'active':''}" data-action="arcadeFilter" data-id="${x}">${x}</button>`).join('')}</div><div class="three-column">${matches.map(gameCard).join('')}</div></section>${section('Built for play, designed for comfort','Future features planned for the real platform.',`<div class="feature-grid">${[['game','Controller-friendly','Dedicated controls and fullscreen mode'],['users','Multiplayer-aware','Connect to authorized existing game backends'],['clock','Resume anytime','Supported saves and recent activity'],['star','Originals first','Games developed in your own studio']].map(([ic,t,d])=>`<div class="feature-card">${icon(ic)}<strong>${t}</strong><span>${d}</span></div>`).join('')}</div>`)}${demo('Only Neon Snake is genuinely playable here. Project Pancake and other project links are UI placeholders; external games are not embedded or modified.')}`}
function projects(){return `${pageHeader('Projects','A studio showcase for your games, software, experiments, and releases. No résumé or job history.',`<button class="btn outline" data-action="githubInfo">${icon('git')} GitHub integration</button>`)}<div class="spotlight"><div class="spotlight-copy"><div class="overline">FROM THE STUDIO</div><h1>Building worlds,<br>one idea at a time.</h1><p>Follow experiments, playable projects, release milestones, and everything currently under construction.</p><div class="hero-actions"><button class="btn primary" data-action="projectDetails" data-id="pancake-project">${icon('spark')} Featured project</button><button class="btn outline" data-action="githubInfo">${icon('git')} Repositories</button></div></div><div class="spotlight-art" style="background:radial-gradient(ellipse at 45% 32%,#6e8fb7,#34375b 45%,#121723 90%)"></div></div>${section('Featured work','Real project concepts and planned showcase cards.',`<div style="display:flex;flex-direction:column;gap:16px">${D.projects.map(x=>`<article class="project-card"><div class="project-thumb" ${artStyle(x.art)}></div><div><div class="overline">${esc(x.kind)} · ${esc(x.status)}</div><h3 style="margin-top:7px">${esc(x.name)}</h3><p>${esc(x.description)}</p><div class="stack-list">${x.stack.map(y=>`<span class="tag">${esc(y)}</span>`).join('')}</div><div style="margin-top:15px"><button class="btn xs outline" data-action="projectDetails" data-id="${x.id}">Project details ${icon('arrow')}</button></div></div></article>`).join('')}</div>`)}${demo('Project statuses are editorial demo labels. No personal GitHub username, repository URL, or release download has been invented.')}`}
function servers(){return `${pageHeader('Game servers','Your multiplayer communities in one place: current status, mods, rules, and join instructions.',`<span class="pill neutral">${icon('wifi')} LIVE STATUS NOT CONNECTED</span>`)}<div class="spotlight"><div class="spotlight-copy"><div class="overline">GLINT COMMUNITY WORLDS</div><h1>Bring your friends.</h1><p>Build a base, explore new biomes, fight bosses, or start a new survival world together.</p><div class="hero-actions"><button class="btn primary" data-action="serverDetails" data-id="mc-survival">${icon('server')} Explore servers</button><button class="btn outline" data-action="serverRules">${icon('shield')} Community rules</button></div></div><div class="spotlight-art" style="background:radial-gradient(ellipse at 50% 35%,#6fae8b,#365c64 48%,#141d31 90%)"></div></div><section class="section"><div class="section-heading"><h2>Hosted worlds</h2><span class="pill neutral">Sample listings</span></div><div class="three-column">${D.servers.map(s=>`<article class="server-card"><div class="server-icon">${icon('server')}</div><div><h3>${esc(s.name)}</h3><p class="muted" style="font-size:12px;line-height:1.6;margin-top:8px">${esc(s.description)}</p></div><span class="pill neutral">${icon('clock')} ${esc(s.status)}</span><div class="server-meta"><div><small>Game</small><strong>${esc(s.game)}</strong></div><div><small>Players</small><strong>${esc(s.players)}</strong></div><div><small>Version</small><strong>${esc(s.version)}</strong></div><div><small>Modpack</small><strong>${esc(s.modpack)}</strong></div></div><button class="btn outline slim" data-action="serverDetails" data-id="${s.id}">View server ${icon('arrow')}</button></article>`).join('')}</div></section>${section('Preparing to join','Designed for modded Minecraft and Valheim.',`<div class="three-column">${[['download','Modpack guides','Versions, loaders, pack links and setup instructions'],['shield','Protected access','Join details and whitelist instructions only for approved players'],['wifi','Live diagnostics','Accurate server status once connected to a status collector']].map(([ic,t,d])=>`<div class="benefit">${icon(ic)}<strong>${t}</strong><p>${d}</p></div>`).join('')}</div>`)}${demo('No real game server addresses, passwords, player counts, whitelist entries or monitoring credentials are stored in this mockup.')}`}
function vip(){return `${pageHeader('Glint VIP','A simple $0.99/month membership for original Glint perks and personalization.')}<div class="vip-hero"><div class="overline">A LITTLE EXTRA FOR YOUR LOUNGE</div><h1 style="margin-top:12px">Make it yours.</h1><p class="muted" style="max-width:490px;line-height:1.7;margin-top:13px">Support future Glint originals and unlock cosmetic perks without changing access to third-party media or private game servers.</p><div class="vip-price">$0.99 <small>/ month</small></div><div class="hero-actions"><button class="btn primary" data-action="vipToggle">${icon(state.vip?'check':'crown')} ${state.vip?'VIP demo enabled':'Preview VIP upgrade'}</button><button class="btn outline" data-action="vipBilling">${icon('settings')} Billing preview</button></div><p class="notice" style="margin-top:16px">Demonstration only. No charges or active subscription will be created.</p></div>${section('What comes with VIP','Perks tied to original platform features.',`<div class="benefit-grid">${[['spark','Exclusive themes','Access special color palettes and custom interface styles.'],['crown','VIP profile styling','Stand out with a supporter badge and cosmetics.'],['game','Originals early access','Preview eligible original games and studio features earlier.'],['book','Behind the scenes','Get bonus original development posts and concept art.'],['settings','Personal customization','Unlock extra interface personalization settings.'],['heart','Support the studio','Help fund the future of independently created Glint features.']].map(([ic,t,d])=>`<div class="benefit">${icon(ic)}<strong>${t}</strong><p>${d}</p></div>`).join('')}</div>`)}${section('Membership comparison','VIP is separate from third-party media and game-server access.',`<div class="panel"><div class="statline"><span>Registered account and basic personalization</span><strong>Free + VIP</strong></div><div class="statline"><span>Explore available site sections</span><strong>Free + VIP</strong></div><div class="statline"><span>VIP badge and themes</span><strong>VIP</strong></div><div class="statline"><span>Original game early-access perks</span><strong>VIP</strong></div><div class="statline"><span>Paid copyrighted media access</span><strong>Not included</strong></div><div class="statline"><span>Private Minecraft/Valheim server access</span><strong>Separate authorization</strong></div></div>`)}${demo('Stripe is not integrated. The VIP button toggles a local design preview; it does not create a customer, payment, or subscription.')}`}
function account(){return `${pageHeader('Your account','Customize your space, manage your demo profile, and control accessibility settings.',`<button class="btn outline" data-action="logout">${icon('logout')} Sign out</button>`)}<div class="settings-grid"><div class="settings-tabs">${[['profile','Profile'],['preferences','Preferences'],['privacy','Privacy & Access'],['billing','Membership'],['about','About the prototype']].map(([key,n])=>`<button class="settings-tab ${state.settingsTab===key?'active':''}" data-action="settingsTab" data-id="${key}">${n}</button>`).join('')}</div><div class="panel">${settingsContent()}</div></div>`}
function settingsContent(){switch(state.settingsTab){case'profile':return `<h2 style="margin-bottom:8px">Profile</h2><p class="muted" style="margin-bottom:25px">Demo profile data is stored only in this browser.</p><form id="profile-form"><div class="field"><label for="profileName">Display name</label><input id="profileName" name="name" maxlength="45" value="${esc(state.user?.name||'')}" required></div><div class="field"><label for="profileEmail">Email (display only)</label><input id="profileEmail" name="email" type="email" maxlength="100" value="${esc(state.user?.email||'')}" required></div><button class="btn primary" type="submit">${icon('check')} Save demo profile</button></form>`;case'preferences':return `<h2 style="margin-bottom:15px">Preferences</h2>${[['reduceMotion','Reduce animations','Use a quieter interface with fewer transitions.'],['dense','Compact catalog layout','Fits more title cards in each row.'],['autoplay','Autoplay previews','Future setting; no videos are autoplayed now.'],['notifications','Notifications','Show mock updates and announcements.']].map(([k,n,d])=>`<div class="toggle-row"><div><strong>${n}</strong><small>${d}</small></div><button role="switch" aria-checked="${!!state.settings[k]}" class="switch ${state.settings[k]?'on':''}" data-action="settingToggle" data-id="${k}" aria-label="${n}"></button></div>`).join('')}`;case'privacy':return `<h2>Privacy & access</h2><p class="muted" style="line-height:1.8;margin:13px 0">This mockup does not send your data to a server. It stores demo preferences and progress in your local browser. The production build will use proper authentication, protected sessions, access scopes and account deletion.</p><div class="statline"><span>Sign-in</span><strong>Local demonstration</strong></div><div class="statline"><span>Connected external accounts</span><strong>None</strong></div><div class="statline"><span>Plex connection</span><strong>Not configured</strong></div><div class="statline"><span>Game server access</span><strong>Not configured</strong></div><button class="btn outline" style="margin-top:15px" data-action="clearDemo">Clear local demo data</button>`;case'billing':return `<h2>Membership</h2><div class="statline"><span>Current mode</span><strong>${state.vip?'VIP demo':'Standard demo'}</strong></div><div class="statline"><span>Recurring billing</span><strong>Not enabled</strong></div><div class="statline"><span>Payment method</span><strong>None collected</strong></div><button class="btn outline" style="margin-top:20px" data-route="vip">See VIP page ${icon('arrow')}</button>`;default:return `<h2>Glint UI Prototype</h2><p class="muted" style="line-height:1.8;margin:15px 0">This is a standalone frontend demonstration. Every action is local and illustrative. There is no Plex, ErsatzTV, Komga, GitHub, Stripe, Minecraft or Valheim connection, and no commercial media or ROMs are included.</p><div class="statline"><span>Prototype</span><strong>Phase 0 / UI concept</strong></div><div class="statline"><span>Dependencies</span><strong>None</strong></div><div class="statline"><span>Saved preferences</span><strong>Browser localStorage</strong></div>`}}
function admin(){return `${pageHeader('Control Center','A preview of the Glint administration experience. All statuses are deliberately simulated.',`<span class="pill neutral">${icon('shield')} ADMIN UI MOCK</span>`)}<div class="admin-stats">${[['users','1','Demo profile'],['film','24','Catalog entries'],['tv','6','Planned channels'],['server','0','Services connected']].map(([i,n,t])=>`<div class="admin-stat">${icon(i)}<strong>${n}</strong><span>${t}</span></div>`).join('')}</div><section class="section two-column"><div class="panel"><h3>Integration health</h3>${[['Plex','On-demand library'],['ErsatzTV / custom playout','Live broadcasting'],['Komga','Reading library'],['GitHub','Project releases'],['Stripe','VIP billing'],['Minecraft / Valheim','Game status collectors']].map(([a,b])=>`<div class="service-row"><div><strong>${a}</strong><div class="muted" style="font-size:11px;margin-top:4px">${b}</div></div><span class="pill neutral">Not connected</span></div>`).join('')}</div><div class="panel"><h3>Suggested admin actions</h3><div style="display:flex;flex-direction:column;gap:11px;margin-top:20px">${[['Media scan','Start a mock library refresh'],['Channel schedules','Preview a timeline export'],['Users','View demo membership'],['Server status','Inspect offline placeholders'],['Backup health','Check future backup monitoring']].map(([n,d])=>`<button class="btn outline" style="justify-content:flex-start" data-action="adminMock" data-id="${esc(n)}">${icon('settings')} ${n}</button><div class="muted" style="font-size:11px;margin:-6px 0 5px 5px">${d}</div>`).join('')}</div></div></section>${demo('No actual admin operations exist. These controls only preview user interface interactions and never change a server, account, billing state, or file.')}`}
function render(){let valid=['home','watch','live','comics','arcade','projects','servers','vip','account','admin'];if(!valid.includes(state.route))state.route='home';if(!state.user){$('#app').innerHTML=`<div class="auth-box"><div class="auth-splash"><div class="brand"><span class="brand-mark">g</span><span class="brand-word">glint<span class="period">.</span></span></div><h1>Welcome to your lounge.</h1><p>Use a local demo profile to preview the experience. This is not a real account system.</p><form id="login-form"><div class="field"><label for="authName">Display name</label><input id="authName" name="name" required placeholder="Your name" maxlength="45" autocomplete="nickname"></div><div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" name="email" required placeholder="you@example.com" maxlength="100" autocomplete="email"></div><button class="btn primary" type="submit">${icon('arrow')} Enter Glint demo</button></form><p class="notice" style="margin-top:19px">No password, real sign-in, or external accounts. The form only stores local demo preferences.</p></div></div>`;return}
const views={home,watch,live,comics,arcade,projects,servers,vip,account,admin};$('#app').innerHTML=`<div class="app-shell">${sidebar()}<div class="layout">${topbar()}<main class="main" id="maincontent">${views[state.route]()}</main></div>${bottomNav()}</div>`;if(state.settings.reduceMotion)document.documentElement.style.scrollBehavior='auto';document.body.classList.toggle('compact-mode',state.settings.dense);document.body.classList.toggle('vip-demo',state.vip)}
function route(r){state.route=r;state.sidebar=false;state.filter=state.route==='watch'?state.filter:state.filter;history.replaceState(null,'','#'+r);render();window.scrollTo({top:0,behavior:state.settings.reduceMotion?'instant':'smooth'})}
function toast(t,head='Preview mode'){const el=$('#toast-region');el.innerHTML=`<div class="toast"><strong>${esc(head)}</strong>${esc(t)}</div>`;clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>el.innerHTML='',3700)}
function showModal(inner,wide=false){$('#portal').innerHTML=`<div class="modal-backdrop" data-dismiss="true"><div class="modal ${wide?'wide-modal':''}" role="dialog" aria-modal="true">${inner}</div></div>`;document.body.style.overflow='hidden'}
function closeModal(){state.modal=null;$('#portal').innerHTML='';document.body.style.overflow='';stopGame()}
const modalHeader=(title)=>`<div class="modal-head"><h2>${esc(title)}</h2><button class="modal-close" data-action="close" aria-label="Close dialog">${icon('close')}</button></div>`;
function mediaDetails(id){let x=getMedia(id);if(!x)return;let inList=state.watchlist.includes(id);showModal(`${modalHeader(x.title)}<div class="modal-body"><div class="detail-layout"><div class="detail-poster">${posterCard(x)}</div><div><div class="overline">${esc(x.genre.toUpperCase())} · ${esc(x.type.toUpperCase())}</div><div class="detail-meta"><span>${esc(x.year)}</span><span>•</span><span>${esc(x.rating)}</span><span>•</span><span>${esc(x.length)}</span><span class="pill neutral">${esc(x.quality)}</span></div><p class="detail-desc">${esc(x.description)}</p><div class="hero-actions"><button class="btn primary" data-action="fakePlay" data-id="${x.id}">${icon('play')} Preview player</button><button class="btn outline" data-action="watchlist" data-id="${x.id}">${icon(inList?'check':'plus')} ${inList?'In My List':'Add to My List'}</button></div><div class="separator"></div><h3>${x.type==='Series'?'Episodes':'Playback'}</h3><p class="muted" style="line-height:1.8;margin-top:10px">${x.type==='Series'?'Season navigation, episode selection, and progress synchronization will be provided by the future Plex adapter.':'High-quality playback, captions, resume and audio tracks will be handled in the real Plex integration.'}</p><div class="kpi-mini" style="margin-top:12px"><span>Library source: Plex (planned)</span><span>Availability: Demo only</span></div></div></div></div>`)}
function fakePlayer(id){let x=getMedia(id);if(!x)return;showModal(`${modalHeader('Glint Watch · Player concept')}<div class="modal-body"><div class="fake-video" style="border-radius:13px" ${artStyle(x.art)}><div class="stage-top"><span class="pill neutral">${icon('film')} PLAYER DEMO</span></div><div class="tv-wordmark"><strong>${esc(x.title)}</strong><span>This is a static UI visualization, not a media stream.</span></div></div><div class="controls"><button class="round-icon" data-action="playerMock" data-id="Rewind">${icon('rewind')}</button><button class="round-icon main" data-action="playerMock" data-id="Play/Pause">${icon('play')}</button><button class="round-icon" data-action="playerMock" data-id="Skip">${icon('forward')}</button><button class="round-icon" data-action="playerMock" data-id="Fullscreen">${icon('maximize')}</button></div><div class="demo-banner" style="margin-top:18px">${icon('info')} No copyrighted video files or Plex access tokens are bundled with this prototype.</div></div>`,true)}
function comicDetails(id){let x=D.comics.find(c=>c.id===id);if(!x)return;showModal(`${modalHeader(x.name)}<div class="modal-body"><div class="detail-layout"><div class="detail-poster">${posterCard(x,'comic')}</div><div><div class="overline">${esc(x.kind)} · ${esc(x.creator)}</div><div class="detail-meta"><span>${esc(x.issues)}</span><span>•</span><span>${state.comicPages[id]||1} / 12 demo pages</span></div><p class="detail-desc">${esc(x.desc)}</p><div class="hero-actions"><button class="btn primary" data-action="readComic" data-id="${id}">${icon('book')} Open demo reader</button></div><p class="devnote" style="margin-top:18px">Placeholder page art only. No copyrighted comic content is included.</p></div></div></div>`)}
function reader(id){let x=D.comics.find(c=>c.id===id);if(!x)return;let p=state.comicPages[id]||1;let symbols=['✦','❋','◇','☼','◉','⌘','✧','✷','☾','♢','✺','✦'];showModal(`${modalHeader(x.name+' · Reader')}<div class="modal-body"><div class="reader-page" ${artStyle(x.art)}><span class="overline">GLINT READER · CONCEPT ART</span><span class="bigmark">${symbols[(p-1)%symbols.length]}</span><h2>${esc(x.name)}</h2><p>Sample page ${p} of 12<br>No actual comic pages are loaded.</p></div><div class="reader-tools" style="margin-top:19px"><button class="btn outline" data-action="comicPage" data-id="${id}" data-delta="-1" ${p<=1?'disabled':''}>${icon('back')} Previous</button><span class="muted">Page ${p} / 12</span><button class="btn primary" data-action="comicPage" data-id="${id}" data-delta="1" ${p>=12?'disabled':''}>Next ${icon('chev')}</button></div><div class="demo-banner" style="margin-top:14px">${icon('info')} Page bookmarks are stored only in this browser. The production reader will use Komga.</div></div>`,true)}
function projectDetails(id){let p=D.projects.find(x=>x.id===id);if(!p)return;showModal(`${modalHeader(p.name)}<div class="modal-body"><div class="spotlight-art" ${artStyle(p.art)} style="height:180px;min-height:180px;border-radius:12px;margin-bottom:20px"></div><div class="overline">${esc(p.kind)} · ${esc(p.status)}</div><p class="detail-desc" style="margin-top:15px">${esc(p.description)}</p><div class="stack-list">${p.stack.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div class="statline" style="margin-top:13px"><span>Recent focus</span><strong>${esc(p.updates)}</strong></div><div class="demo-banner" style="margin-top:18px">${icon('git')} A verified GitHub profile/repository has not been connected; no personal links are fabricated.</div><div class="hero-actions"><button class="btn outline" data-action="githubInfo">${icon('git')} GitHub integration details</button></div></div>`)}
function serverDetails(id){let s=D.servers.find(x=>x.id===id);if(!s)return;showModal(`${modalHeader(s.name)}<div class="modal-body"><p class="detail-desc">${esc(s.description)}</p><div class="kpi-mini" style="margin:20px 0"><span>${esc(s.game)}</span><span>${esc(s.status)}</span><span>${esc(s.modpack)}</span></div><h3>Before joining</h3><div style="margin-top:10px">${s.requirements.map((x,i)=>`<div class="statline"><span>${i+1}. ${esc(x)}</span>${icon('check')}</div>`).join('')}</div><div class="demo-banner" style="margin-top:19px">${icon('shield')} Join address, whitelist, credentials and downloads will be available only when authorized and configured. None are present in this mockup.</div><div class="hero-actions"><button class="btn outline" data-action="copyNoAddress">${icon('copy')} Copy address</button><button class="btn outline" data-action="serverRules">${icon('shield')} Community rules</button></div></div>`)}
function gameDetails(id){let g=D.games.find(x=>x.id===id);if(!g)return;if(id==='glint-snake'){snakeModal();return}showModal(`${modalHeader(g.name)}<div class="modal-body"><div class="game-banner" ${artStyle(g.art)} style="border-radius:12px;margin-bottom:22px"><strong>${esc(g.name)}</strong></div><div class="overline">${esc(g.category)} · ${esc(g.status)}</div><p class="detail-desc" style="margin-top:13px">${esc(g.detail)}</p><div class="hero-actions"><button class="btn primary" disabled>${icon('play')} Build not connected</button><button class="btn outline" data-route="projects">${icon('code')} Browse projects</button></div><div class="demo-banner" style="margin-top:20px">${icon('info')} Game launch is disabled until a verified, playable build URL is configured.</div></div>`)}
function snakeModal(){state.game={snake:[{x:7,y:7},{x:6,y:7}],food:{x:10,y:7},dir:{x:1,y:0},queued:{x:1,y:0},score:0,alive:true,started:false};showModal(`${modalHeader('Neon Snake · Playable UI demo')}<div class="modal-body"><p class="muted" style="margin-bottom:12px;text-align:center">Use arrow keys or WASD. Eat the stars, avoid the walls and your tail.</p><canvas id="snakeCanvas" class="game-canvas" width="360" height="360" tabindex="0" aria-label="Playable Snake game"></canvas><div class="reader-tools" style="margin-top:12px"><span class="pill">Score: <span id="snakeScore">0</span></span><button class="btn xs primary" data-action="startSnake">${icon('play')} Start / restart</button></div><div class="game-pad"><span></span><button aria-label="Up" data-action="snakeDir" data-id="up">↑</button><span></span><button aria-label="Left" data-action="snakeDir" data-id="left">←</button><button aria-label="Down" data-action="snakeDir" data-id="down">↓</button><button aria-label="Right" data-action="snakeDir" data-id="right">→</button></div><p class="devnote" style="text-align:center;margin-top:15px">Runs entirely in your browser. No external game, server, ROM or payment is involved.</p></div>`,true);drawSnake()}
function stopGame(){if(state.gameTimer)clearInterval(state.gameTimer);state.gameTimer=null;state.game=null}
function drawSnake(){const cv=$('#snakeCanvas'),g=state.game;if(!cv||!g)return;const ctx=cv.getContext('2d'),sz=24;ctx.fillStyle='#0b0f1c';ctx.fillRect(0,0,360,360);ctx.strokeStyle='#242941';ctx.lineWidth=.45;for(let i=0;i<=15;i++){ctx.beginPath();ctx.moveTo(i*sz,0);ctx.lineTo(i*sz,360);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*sz);ctx.lineTo(360,i*sz);ctx.stroke()}g.snake.forEach((p,i)=>{ctx.fillStyle=i===0?'#c0b3ff':'#6e5fc2';ctx.fillRect(p.x*sz+2,p.y*sz+2,sz-4,sz-4)});ctx.fillStyle='#89e1c8';ctx.beginPath();ctx.arc((g.food.x+.5)*sz,(g.food.y+.5)*sz,8,0,Math.PI*2);ctx.fill();if(!g.started||!g.alive){ctx.fillStyle='#0a0d16be';ctx.fillRect(0,0,360,360);ctx.fillStyle='#eee8ff';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText(g.alive?'READY TO PLAY':'GAME OVER',180,173);ctx.font='14px sans-serif';ctx.fillStyle='#b6acd1';ctx.fillText(g.alive?'Press Start to begin':'Press Start to try again',180,198)}const score=$('#snakeScore');if(score)score.textContent=g.score}
function moveSnake(){let g=state.game;if(!g||!g.alive||!g.started)return;g.dir=g.queued;let h={x:g.snake[0].x+g.dir.x,y:g.snake[0].y+g.dir.y};let eats=h.x===g.food.x&&h.y===g.food.y;let body=eats?g.snake:g.snake.slice(0,-1);if(h.x<0||h.x>=15||h.y<0||h.y>=15||body.some(p=>p.x===h.x&&p.y===h.y)){g.alive=false;clearInterval(state.gameTimer);state.gameTimer=null;drawSnake();return}g.snake.unshift(h);if(eats){g.score+=10;let empty=[];for(let x=0;x<15;x++)for(let y=0;y<15;y++)if(!g.snake.some(p=>p.x===x&&p.y===y))empty.push({x,y});if(empty.length)g.food=empty[Math.floor(Math.random()*empty.length)];else{g.alive=false;clearInterval(state.gameTimer)}}else g.snake.pop();drawSnake()}
function snakeDir(n){let g=state.game;if(!g)return;let m={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}}[n];if(!m)return;if(m.x===-g.dir.x&&m.y===-g.dir.y)return;g.queued=m}
function searchModal(){state.search='';showModal(`${modalHeader('Search Glint')}<div class="modal-body"><div class="search-field">${icon('search')}<input id="globalSearch" autofocus placeholder="Movies, shows, comics, games, projects..." aria-label="Search Glint" autocomplete="off"/></div><p class="devnote" style="margin:15px 0">Searches the local demo catalog. No external APIs are queried.</p><div id="searchResults"></div></div>`,false);setTimeout(()=>$('#globalSearch')?.focus(),20);updateSearch('')}
function updateSearch(q){state.search=q;const hay=[...D.movies.map(x=>({title:x.title,desc:`${x.type} · ${x.genre}`,id:x.id,kind:'details',art:x.art})),...D.comics.map(x=>({title:x.name,desc:`${x.kind} · ${x.creator}`,id:x.id,kind:'comicDetails',art:x.art})),...D.games.map(x=>({title:x.name,desc:`Arcade · ${x.category}`,id:x.id,kind:'gameDetails',art:x.art})),...D.projects.map(x=>({title:x.name,desc:`Project · ${x.kind}`,id:x.id,kind:'projectDetails',art:x.art})),...D.servers.map(x=>({title:x.name,desc:`Server · ${x.game}`,id:x.id,kind:'serverDetails',art:x.art}))];let matches=hay.filter(x=>!q||`${x.title} ${x.desc}`.toLowerCase().includes(q.toLowerCase())).slice(0,q?25:10);let container=$('#searchResults');if(!container)return;container.innerHTML=matches.length?matches.map(x=>`<button class="search-result" data-action="searchResult" data-kind="${x.kind}" data-id="${esc(x.id)}"><span class="mini-poster">${artMark(x.art)}</span><span><strong>${esc(x.title)}</strong><small>${esc(x.desc)}</small></span>${icon('chev')}</button>`).join(''):'<div class="empty-state">No results found in the local demo catalog.</div>'}
function infoModal(kind){const contents={plexInfo:['Plex integration','The production build will use a protected Plex catalog adapter, optional account linking, and authorized official Plex playback initially. No Plex login or API token is requested here.'],komgaInfo:['Komga integration','The comics library will sync metadata and page indexes from a protected Komga service. This mockup contains no real books or pages.'],githubInfo:['GitHub integration','The Projects page will use curated public repositories and verified owner-supplied links. No account name, repository, release or URL has been inferred.'],serverRules:['Community standards','Proposed: Be respectful, do not grief, keep exploits and cheats out of shared worlds, respect whitelist requirements, and follow server-specific rules.'],vipBilling:['Billing preview','Future billing uses Stripe hosted Checkout and a customer portal. This demo does not collect payment details, create subscriptions, or contact Stripe.'],myList:['Your watchlist',state.watchlist.length?`Saved titles: ${state.watchlist.map(id=>getMedia(id)?.title).filter(Boolean).join(', ')}.`:'No titles saved yet. Add favorites from their detail pages.'],recordings:['My recordings',state.recordings.length?`Demo bookmarks: ${state.recordings.map(x=>x.title+' (Ch '+x.channel+')').join(', ')}.`:'Nothing bookmarked. Use the Record button on the Live TV player to simulate a virtual DVR action.'],notifications:['Notifications','Welcome to the Glint UI prototype. No real background jobs or notifications are active.']};let [title,copy]=contents[kind]||['Preview interaction','This feature will be developed after the interface is approved.'];showModal(`${modalHeader(title)}<div class="modal-body"><p class="detail-desc">${esc(copy)}</p><div class="demo-banner" style="margin-top:20px">${icon('info')} Prototype feature. No external service action has occurred.</div></div>`)}
function action(name,id,btn){switch(name){case'menu':state.sidebar=!state.sidebar;render();return;case'search':searchModal();return;case'close':closeModal();return;case'notifications':case'plexInfo':case'komgaInfo':case'githubInfo':case'serverRules':case'vipBilling':case'myList':case'recordings':infoModal(name);return;case'details':mediaDetails(id);return;case'comicDetails':comicDetails(id);return;case'projectDetails':projectDetails(id);return;case'gameDetails':gameDetails(id);return;case'serverDetails':serverDetails(id);return;case'fakePlay':fakePlayer(id);return;case'watchFilter':state.filter=id;render();return;case'comicFilter':state.comicFilter=id;render();return;case'arcadeFilter':state.arcadeFilter=id;render();return;case'watchlist':state.watchlist=state.watchlist.includes(id)?state.watchlist.filter(x=>x!==id):[...state.watchlist,id];setStore('watchlist',state.watchlist);if($('#portal').innerHTML)mediaDetails(id);else render();toast(state.watchlist.includes(id)?'Added to local demo watchlist.':'Removed from local demo watchlist.');return;case'playerMock':toast(id+' is an inactive playback control in the mockup.');return;case'tune':state.channel=id;state.offset=0;state.paused=false;route('live');toast('Switched to channel '+id+'. This is a simulated picture.','Now tuning');return;case'channelStep':{let i=D.channels.findIndex(x=>x.num===state.channel);state.channel=D.channels[(i+Number(id)+D.channels.length)%D.channels.length].num;state.offset=0;state.paused=false;render();return}case'pause':state.paused=!state.paused;render();toast(state.paused?'Playback is paused in the UI demo.':'Returned to playing state.');return;case'liveRewind':state.offset=Math.min(state.offset+15,1800);render();toast('Moved the simulated timeshift position backward.');return;case'liveForward':state.offset=Math.max(0,state.offset-15);render();return;case'goLive':state.offset=0;state.paused=false;render();toast('Back at the simulated live edge.');return;case'restart':state.offset=1800;state.paused=false;render();toast('Restart from beginning is planned; this is a UI simulation.');return;case'record':{let c=D.channels.find(x=>x.num===state.channel);let p=currentProgram(c);state.recordings.unshift({channel:c.num,title:p.title,saved:new Date().toISOString()});setStore('recordings',state.recordings);render();toast('Saved a virtual DVR bookmark. No video has been recorded.','Recording concept');return}case'readComic':reader(id);return;case'comicPage':{let p=Math.max(1,Math.min(12,(state.comicPages[id]||1)+Number(btn.dataset.delta)));state.comicPages[id]=p;setStore('comicPages',state.comicPages);reader(id);return}case'startSnake':{if(state.gameTimer)clearInterval(state.gameTimer);state.game={snake:[{x:7,y:7},{x:6,y:7}],food:{x:10,y:7},dir:{x:1,y:0},queued:{x:1,y:0},score:0,alive:true,started:true};state.gameTimer=setInterval(moveSnake,155);drawSnake();$('#snakeCanvas')?.focus();return}case'snakeDir':snakeDir(id);return;case'settingsTab':state.settingsTab=id;render();return;case'settingToggle':state.settings[id]=!state.settings[id];setStore('settings',state.settings);render();toast('Preference saved in this browser.');return;case'vipToggle':state.vip=!state.vip;setStore('vip',state.vip);render();toast(state.vip?'VIP design mode enabled locally — no payment taken.':'Returned to Standard demo mode.','Membership preview');return;case'logout':state.user=null;setStore('user',state.user);render();return;case'clearDemo':{['watchlist','comicPages','vip','recordings','settings','user'].forEach(k=>{try{localStorage.removeItem('glint_'+k)}catch{}});state.watchlist=[];state.comicPages={};state.vip=false;state.recordings=[];state.settings={reduceMotion:false,dense:false,autoplay:false,notifications:true};state.user={name:'Demo Member',email:'demo@glint.local'};setStore('user',state.user);render();toast('Demo data was cleared from localStorage.');return}case'copyNoAddress':toast('No server address is configured. Nothing copied.');return;case'adminMock':toast(`${id}: no production admin connection is configured.`);return;case'searchResult':{const kind=btn.dataset.kind;closeModal();if(kind==='details')mediaDetails(id);if(kind==='comicDetails')comicDetails(id);if(kind==='gameDetails')gameDetails(id);if(kind==='projectDetails')projectDetails(id);if(kind==='serverDetails')serverDetails(id);return}}}
document.addEventListener('click',e=>{const routeEl=e.target.closest('[data-route]');if(routeEl){e.preventDefault();closeModal();route(routeEl.dataset.route);return}const el=e.target.closest('[data-action]');if(el){e.preventDefault();action(el.dataset.action,el.dataset.id,el);return}if(e.target.matches('[data-dismiss="true"]'))closeModal()});
document.addEventListener('input',e=>{if(e.target.id==='globalSearch')updateSearch(e.target.value)});
document.addEventListener('submit',e=>{if(e.target.id==='login-form'){e.preventDefault();const f=new FormData(e.target);const name=String(f.get('name')||'').trim(),email=String(f.get('email')||'').trim();if(!name||!email)return;state.user={name,email};setStore('user',state.user);render();toast('Demo profile created locally. No account was registered.');return}if(e.target.id==='profile-form'){e.preventDefault();const f=new FormData(e.target);state.user={name:String(f.get('name')||'Demo Member').trim(),email:String(f.get('email')||'demo@glint.local').trim()};setStore('user',state.user);render();toast('Demo profile changes saved locally.');return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#portal').innerHTML){closeModal();return}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();searchModal();return}if(state.game&&state.game.started&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){let map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};if(map[e.key]){e.preventDefault();snakeDir(map[e.key])}}});
window.addEventListener('hashchange',()=>{let key=location.hash.slice(1);if(key&&key!==state.route){state.route=key;render()}});
if(location.hash&&location.hash.length>1)state.route=location.hash.slice(1);
render();
})();

</script>
</body>
